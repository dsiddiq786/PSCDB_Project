# Host nginx site for PSCDB. It answers only for servio.servicesground.com and
# forwards to the PSCDB web container on 127.0.0.1:9000 (WEB_PORT in .env.production).
# Install in /etc/nginx/sites-available/, link into sites-enabled/, then run certbot (see DEPLOY.md).
# Certbot adds the HTTPS server block and the HTTP-to-HTTPS redirect to this file.

server {
    listen 80;
    listen [::]:80;
    server_name servio.servicesground.com;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
