# Runs inside the web container. The host's reverse proxy (nginx-proxy) handles TLS and forwards here.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 3m;
  client_body_timeout 15s;
  client_header_timeout 15s;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # nginx-proxy appends the client address; it is passed on unchanged for the API's rate limits.
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 30s;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Hashed build assets never change, so browsers can keep them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # Never serve hidden files or source maps.
  location ~ /\.|\.map$ {
    return 404;
  }

  # Single-page app: unknown paths load index.html, which must not be cached.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
}
