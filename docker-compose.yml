# PSCDB production stack. Run with: docker compose --env-file .env.production up -d --build
# The web container joins the server's existing nginx-proxy network, which routes
# SITE_HOSTS to it and gets Let's Encrypt certificates for them. It is also published
# on the server's loopback interface (WEB_PORT) for local checks. The API and MongoDB
# stay on a private network and are never exposed.
name: pscdb

services:
  mongo:
    image: ${MONGO_IMAGE:-mongo:8.2}
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
      MONGO_APP_USER: ${MONGO_APP_USER:?set MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./deploy/mongo-init.js:/docker-entrypoint-initdb.d/10-app-user.js:ro
    mem_limit: 1g
    security_opt: ["no-new-privileges:true"]
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks: [internal]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    build: ./Backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: "3002"
      # nginx-proxy appends the client address; the web container passes the header on unchanged.
      TRUST_PROXY: "1"
      # The API uses its own database user, limited to the pscdb database.
      MONGODB_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/pscdb?authSource=pscdb
    volumes:
      - uploads:/app/uploads
    init: true
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    logging: *logs
    depends_on:
      mongo:
        condition: service_healthy
    networks: [internal]

  web:
    build: ./Frontend
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: ${SITE_HOSTS:?set SITE_HOSTS}
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${SITE_HOSTS}
    ports:
      - "127.0.0.1:${WEB_PORT:-9000}:80"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    logging: *logs
    depends_on:
      api:
        condition: service_healthy
    networks: [internal, proxy]

volumes:
  mongo-data:
  uploads:

networks:
  internal:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set PROXY_NETWORK}
