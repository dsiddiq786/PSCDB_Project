# PSCDB production stack. Run with: docker compose --env-file .env.production up -d --build
# Only the web container is published, and only on the server's loopback interface,
# so the host reverse proxy is the single way in. MongoDB is never exposed.
name: pscdb

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks: [internal]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    build: ./Backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: "3002"
      TRUST_PROXY: "1"
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/pscdb?authSource=admin
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks: [internal]

  web:
    build: ./Frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

volumes:
  mongo-data:
  uploads:

networks:
  internal:
